<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Example</title>
    <style>
        body{background-color: lightcyan;}
        h1{color: aqua;}
        p{color:violet; font-size: 18px;}
        #warn{ color: red;font-size: 24px;}
        .highlight{background-color: yellow;}
    </style>
</head>
<body>
    <h1>Welcome</h1>
    <p style="color: teal;">This is inline CSS</p>
    <p>This is internal CSS</p>
    <p id="warn">Smoking is Injurious to Health🚭</p>
    <p class="highlight">Highlighted Text</p>
    <p class="highlight">Anothetr Highlighted Text</p>
</body>
</html>
